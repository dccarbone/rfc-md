name: RFC validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "rfcs/**"
      - "scripts/validate_rfc.py"
      - ".github/workflows/validate-rfc.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-rfc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pyyaml

      - run: python scripts/validate_rfc.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
